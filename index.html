<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoang Vu - Portfolio</title>

    <!-- Fallback avatar icon -->
    <link
      rel="icon"
      type="image/png"
      href="./public/assets/img/avatar.png"
      onerror="this.href = 'https://placehold.co/32x32/6366f1/ffffff?text=HV'"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Devicon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ========================================== -->
    <!-- 1. IMPORT CẤU HÌNH & CSS TỪ BÊN NGOÀI      -->
    <!-- ========================================== -->
    <script src="./js/tailwind.config.js"></script>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body
    class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 transition-colors duration-300 font-sans antialiased selection:bg-primary-500/30 selection:text-primary-700 dark:selection:text-primary-200"
  >
    <!-- Background Decoration -->
    <div class="fixed inset-0 z-0 pointer-events-none bg-dot-pattern"></div>

    <!-- ========================================== -->
    <!-- 2. CÁC PLACEHOLDER CHỨA GIAO DIỆN CON      -->
    <!-- ========================================== -->
    <div id="layout-navbar"></div>
    <main>
      <div id="layout-hero"></div>
      <div id="layout-about"></div>
      <div id="layout-skills"></div>
      <div id="layout-projects"></div>
      <div id="layout-contact"></div>
    </main>
    <div id="layout-footer"></div>

    <!-- ========================================== -->
    <!-- 3. IMPORT CÁC FILE LOGIC (MAIN & PROJECTS) -->
    <!-- ========================================== -->
    <!-- Gọi trực tiếp ở đây để trình duyệt tải file -->
    <script src="./js/main.js"></script>
    <script src="./js/projects.js"></script>

    <!-- ========================================== -->
    <!-- 4. SCRIPT TẢI GIAO DIỆN VÀ KHỞI CHẠY APP   -->
    <!-- ========================================== -->
    <script>
      async function loadHTMLComponent(elementId, filePath) {
        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`Lỗi khi tải: ${filePath}`);
          const htmlData = await response.text();
          document.getElementById(elementId).innerHTML = htmlData;
        } catch (error) {
          console.error(error);
          document.getElementById(elementId).innerHTML =
            `<p class="text-red-500 text-center py-4">Đang phát triển component: ${filePath}</p>`;
        }
      }

      async function bootstrapApp() {
        // Bước 1: Load toàn bộ HTML con
        await Promise.all([
          loadHTMLComponent("layout-navbar", "./components/navbar.html"),
          loadHTMLComponent("layout-hero", "./components/hero.html"),
          loadHTMLComponent("layout-about", "./components/about.html"),
          loadHTMLComponent("layout-skills", "./components/skills.html"),
          loadHTMLComponent("layout-projects", "./components/projects.html"),
          loadHTMLComponent("layout-contact", "./components/contact.html"),
          loadHTMLComponent("layout-footer", "./components/footer.html"),
        ]);

        // Bước 2: KHI GIAO DIỆN ĐÃ CÓ MẶT ĐẦY ĐỦ -> KHỞI CHẠY JAVASCRIPT

        // Gọi hàm App.init() trong file main.js để chạy (Scroll Reveal, Typewriter, Dark Mode...)
        if (typeof App !== "undefined") {
          App.init();
        }

        // Gọi ProjectManager để fetch data từ file JSON đổ vào
        if (typeof ProjectManager !== "undefined") {
          const projectManager = new ProjectManager("projects-container");
          projectManager.loadProjects();
        }

        // Bước 3: Tạo icon bằng thư viện Lucide
        setTimeout(() => {
          if (window.lucide) {
            lucide.createIcons();
          }
        }, 100);
      }

      // Bắt đầu toàn bộ quy trình khi tải xong trang web
      document.addEventListener("DOMContentLoaded", bootstrapApp);
    </script>
  </body>
</html>
